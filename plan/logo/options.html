<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--a:#ff6b5b;--b:#2ec4b6;--tile:#111;--tile-fg:#ededed;--icon:#1a1a1a}
body.light{--tile:#f3f0ea;--tile-fg:#151515;--icon:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground)}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 8px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--foreground);font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--secondary);border-color:var(--ring)}
.sw{display:inline-flex}.sw i{width:12px;height:12px;border-radius:50%;margin-right:-3px;box-shadow:0 0 0 1.5px var(--background)}
.sep{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{border-radius:var(--radius,14px);background:var(--tile);color:var(--tile-fg);padding:16px;display:grid;gap:10px}
.big{display:grid;place-items:center;height:150px}
.big svg{width:128px;height:128px;overflow:visible}
.big svg.wide{width:200px;height:110px}
.row{display:flex;align-items:center;gap:10px}
.app{width:52px;height:52px;border-radius:12px;background:var(--icon);display:grid;place-items:center;box-shadow:0 0 0 1px #8883}
.app svg{width:40px;height:40px}
.fav svg{width:18px;height:18px;display:block}
.fav{padding:6px;border-radius:6px;background:var(--icon);box-shadow:0 0 0 1px #8883}
.name{font-weight:650;font-size:14px}
.idea{font-size:12.5px;opacity:.68;line-height:1.35}
.num{font-size:11px;opacity:.5;font-variant-numeric:tabular-nums}
.fa{fill:var(--a)}.fb{fill:var(--b)}.ff{fill:var(--tile-fg)}
.sa,.sb,.sf{fill:none;stroke-linecap:round;stroke-linejoin:round}
.sa{stroke:var(--a)}.sb{stroke:var(--b)}.sf{stroke:var(--tile-fg);opacity:.35}
.fb-box,.vb{transform-box:fill-box;transform-origin:center}
.view{transform-box:view-box}
/* motion, only while .anim is on */
@keyframes blink{0%{opacity:.15}12%{opacity:1}55%,100%{opacity:.15}}
@keyframes slide{0%{transform:translate(-9px,-9px);opacity:0}35%{opacity:.55}70%{transform:none;opacity:.55}100%{transform:none;opacity:0}}
@keyframes ringout{0%{transform:translateX(-24px);opacity:0}40%{transform:none;opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes wave{0%{transform:scale(.2);opacity:0}15%{opacity:.7}55%{transform:scale(1);opacity:.45}100%{transform:scale(1.2);opacity:0}}
@keyframes pop{0%,38%{transform:scale(.5);opacity:.35}50%{transform:scale(1.3);opacity:1}70%,100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}18%{transform:scale(1.28)}40%{transform:scale(1)}}
@keyframes draw{0%{stroke-dashoffset:100;opacity:1}45%,80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes breathe{0%{transform:scale(.55);opacity:0}35%{opacity:1}100%{transform:scale(1.2);opacity:0}}
@keyframes ripple{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.45);opacity:0}}
@keyframes go{0%{transform:translateX(-8px);opacity:0}10%{opacity:1}44%{transform:translateX(38px);opacity:1}50%,100%{transform:translateX(38px);opacity:0}}
@keyframes back{0%,46%{transform:translateX(20px);opacity:0}52%{opacity:1}100%{transform:translateX(-14px);opacity:0}}
@keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
@keyframes apartL{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
@keyframes apartR{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes turn{0%,15%{transform:rotate(0);fill:var(--a);opacity:.3}60%,100%{transform:rotate(180deg);fill:var(--b);opacity:1}}
.anim .A1{animation:blink 2.8s infinite}.anim .A2{animation:blink 2.8s .25s infinite}.anim .A3{animation:blink 2.8s .7s infinite}.anim .A4{animation:blink 2.8s .95s infinite}
.anim .B1{animation:slide 2.8s infinite}
.anim .C1{animation:ringout 2.8s cubic-bezier(.22,1,.36,1) infinite}
.anim .D1{transform-origin:34px 60px;animation:wave 2.8s ease-out infinite}.anim .D2{animation:pop 2.8s infinite}.anim .D3{animation:pop 2.8s .08s infinite}
.anim .E1{animation:pulse 2.4s infinite}.anim .E2{animation:pulse 2.4s .25s infinite}.anim .E3{animation:pulse 2.4s .5s infinite}
.anim .F1{stroke-dasharray:100;animation:draw 3s infinite}.anim .F2{stroke-dasharray:100;animation:draw 3s .7s infinite}
.anim .G1{animation:blink 2.6s .2s infinite}.anim .G2{animation:blink 2.6s .9s infinite}
.anim .H1{transform-origin:60px 66px;animation:breathe 2.6s ease-out infinite}
.anim .I1{animation:ripple 2.4s ease-out infinite}.anim .I2{animation:ripple 2.4s 1.2s ease-out infinite}
.anim .J1{animation:go 2.8s cubic-bezier(.5,0,.75,0) infinite}.anim .J2{animation:back 2.8s cubic-bezier(.25,1,.5,1) infinite}
.anim .K1{animation:eq 1.4s infinite}.anim .K2{animation:eq 1.4s .2s infinite}.anim .K3{animation:eq 1.4s .4s infinite}
.anim .K4{animation:eq 1.4s .7s infinite}.anim .K5{animation:eq 1.4s .9s infinite}.anim .K6{animation:eq 1.4s 1.1s infinite}
.anim .L1{animation:apartL 3s ease-in-out infinite}.anim .L2{animation:apartR 3s ease-in-out infinite}
.anim .M1{animation:blink 2.8s infinite}.anim .M2{animation:blink 2.8s .3s infinite}.anim .M3{animation:blink 2.8s .7s infinite}
.anim .N1{transform-origin:60px 60px;animation:orbit 6s linear infinite}
.anim .O1{transform-origin:60px 60px;animation:turn 3s cubic-bezier(.65,0,.35,1) infinite alternate}
</style></head><body class="anim">
<div class="top" id="palettes"></div>
<div class="top">
  <button class="chip" id="motion" aria-pressed="true">Motion on</button>
  <button class="chip" id="bg" aria-pressed="false">Light tiles</button>
</div>
<div class="grid" id="grid"></div>
<script>
const f=n=>Math.round(n*10)/10;
const rad=d=>d*Math.PI/180;
const arc=(cx,cy,r,a0,a1)=>`M${f(cx+r*Math.cos(rad(a0)))} ${f(cy+r*Math.sin(rad(a0)))}A${r} ${r} 0 ${Math.abs(a1-a0)>180?1:0} 1 ${f(cx+r*Math.cos(rad(a1)))} ${f(cy+r*Math.sin(rad(a1)))}`;
const wave='M16 52C26 34 35 34 45 52S64 70 74 52S94 34 104 52';
const e='M32 56H80A24 24 0 1 0 73 73';
const marks=[
 {name:'Ripple pair',idea:'A sound on one side, its echo answering on the other.',svg:`<circle class="fa" cx="60" cy="60" r="11"/><path class="sa A1" stroke-width="7" d="${arc(60,60,25,-40,40)}"/><path class="sa A2" stroke-width="7" d="${arc(60,60,40,-40,40)}"/><path class="sb A3" stroke-width="7" d="${arc(60,60,25,140,220)}"/><path class="sb A4" stroke-width="7" d="${arc(60,60,40,140,220)}"/>`},
 {name:'Echo e',idea:'The letter e with its echo trailing behind it.',svg:`<g transform="translate(9 9)"><path class="sb B1" stroke-width="12" opacity=".55" d="${e}"/></g><path class="sa" stroke-width="12" d="${e}"/>`},
 {name:'Two rings',idea:'A solid sound and the hollow ring it leaves behind.',svg:`<circle class="sb C1" stroke-width="8" cx="72" cy="60" r="20"/><circle class="fa" cx="48" cy="60" r="20"/>`},
 {name:'One to many',idea:'One source, a wave, and every listener it reaches.',svg:`<path class="sb view D1" stroke-width="3" opacity=".45" d="${arc(34,60,52,-52,52)}"/><circle class="fa" cx="34" cy="60" r="12"/><circle class="fb vb D2" cx="76.6" cy="30.2" r="7"/><circle class="fb vb D3" cx="86" cy="60" r="7"/><circle class="fb vb D2" cx="76.6" cy="89.8" r="7"/>`},
 {name:'Delay trail',idea:'Each repeat a little later and a little quieter.',svg:`<circle class="fa vb E1" cx="32" cy="60" r="16"/><circle class="fb vb E2" cx="66" cy="60" r="12" opacity=".75"/><circle class="fb vb E3" cx="92" cy="60" r="8" opacity=".45"/>`},
 {name:'Reflection',idea:'A sound wave and its mirror image.',svg:`<path class="sa F1" pathLength="100" stroke-width="8" d="${wave}"/><path class="sb F2" pathLength="100" stroke-width="8" opacity=".5" transform="translate(0 120) scale(1 -1)" d="${wave}"/>`},
 {name:'Pulse',idea:'A dot, its sound, then its echo, fainter.',svg:`<circle class="fa" cx="38" cy="60" r="13"/><path class="sa G1" stroke-width="8" d="${arc(38,60,30,-45,45)}"/><path class="sb G2" stroke-width="8" d="${arc(38,60,50,-45,45)}"/>`},
 {name:'Headphones',idea:'The band carries the echo; every head gets one.',svg:`<path class="sa" stroke-width="8" d="${arc(60,70,34,180,360)}"/><path class="sb view H1" stroke-width="6" d="${arc(60,70,20,205,335)}"/><rect class="fa" x="20" y="62" width="16" height="30" rx="8"/><rect class="fa" x="84" y="62" width="16" height="30" rx="8"/>`},
 {name:'Wordmark',wide:true,idea:'Plain "ek" with a ringing o. The o alone is the icon.',svg:`<text x="8" y="84" class="ff" font-family="Nunito,ui-rounded,system-ui,sans-serif" font-weight="800" font-size="78" letter-spacing="-3">ek</text><circle class="sb vb I1" stroke-width="4" cx="160" cy="60" r="34"/><circle class="sb vb I2" stroke-width="4" cx="160" cy="60" r="34"/><circle class="sa" stroke-width="13" cx="160" cy="60" r="20"/>`,icon:`<circle class="sb vb I1" stroke-width="5" cx="60" cy="60" r="40"/><circle class="sa" stroke-width="15" cx="60" cy="60" r="24"/>`},
 {name:'Wall bounce',idea:'Literally an echo: out to the wall, then back.',svg:`<line class="sf" stroke-width="6" x1="100" y1="30" x2="100" y2="90"/><circle class="fa" cx="22" cy="60" r="8"/><path class="sa J1" stroke-width="8" d="${arc(22,60,24,-50,50)}"/><path class="sb J2" stroke-width="8" d="${arc(88,60,24,130,230)}"/>`},
 {name:'Levels',idea:'Three levels, then the same three, quieter.',svg:`<rect class="fa vb K1" x="16" y="48" width="10" height="24" rx="5"/><rect class="fa vb K2" x="31" y="37" width="10" height="46" rx="5"/><rect class="fa vb K3" x="46" y="45" width="10" height="30" rx="5"/><rect class="fb vb K4" x="68" y="52" width="10" height="16" rx="5" opacity=".6"/><rect class="fb vb K5" x="83" y="45" width="10" height="30" rx="5" opacity=".6"/><rect class="fb vb K6" x="98" y="50" width="10" height="20" rx="5" opacity=".6"/>`},
 {name:'Overlap',idea:'Two rings sharing the same sound.',svg:`<circle class="sa L1" stroke-width="8" cx="48" cy="60" r="24"/><circle class="sb L2" stroke-width="8" cx="72" cy="60" r="24" opacity=".85"/>`},
 {name:'Broadcast',idea:'Sound spreading out from one corner, like the room.',svg:`<circle class="fa" cx="30" cy="90" r="10"/><path class="sa M1" stroke-width="8" d="${arc(30,90,30,-90,0)}"/><path class="sb M2" stroke-width="8" d="${arc(30,90,50,-90,0)}"/><path class="sb M3" stroke-width="8" opacity=".5" d="${arc(30,90,70,-90,0)}"/>`},
 {name:'Orbit',idea:'A listener circling the source, always in reach.',svg:`<circle class="sf" stroke-width="3" cx="60" cy="60" r="38"/><circle class="fa" cx="60" cy="60" r="16"/><g class="view N1"><circle class="fb" cx="98" cy="60" r="9"/></g>`},
 {name:'Half turn',idea:'One half, turned around, becomes its echo.',svg:`<path class="fa" d="M60 22A38 38 0 0 0 60 98Z"/><path class="fb view O1" transform="rotate(180 60 60)" d="M60 22A38 38 0 0 0 60 98Z"/>`},
];
const palettes=[
 ['Coral + teal','#ff6b5b','#2ec4b6'],['Violet + mint','#8b7cf6','#5eead4'],['Orange + blue','#ff8a3d','#4f8cff'],
 ['Rose + sky','#ff7aa8','#7cc7ff'],['Lime','#c6f432','#7f9e1f'],['Mono','#ededed','#7a7a7a'],['Amber + cyan (Tauri)','#ffc131','#24c8db']];
const svg=(m,body,cls='')=>`<svg class="${cls}" viewBox="${m.wide&&!cls.includes('ico')?'0 0 210 120':'0 0 120 120'}" aria-hidden="true">${body}</svg>`;
document.getElementById('grid').innerHTML=marks.map((m,i)=>`<div class="card"><div class="big">${svg(m,m.svg,m.wide?'wide':'')}</div>
<div class="row"><div class="app">${svg(m,m.icon??m.svg,'ico')}</div><div class="fav">${svg(m,m.icon??m.svg,'ico')}</div>
<div><div class="num">${String(i+1).padStart(2,'0')}</div><div class="name">${m.name}</div></div></div><div class="idea">${m.idea}</div></div>`).join('');
const bar=document.getElementById('palettes');
bar.innerHTML=palettes.map(([n,a,b],i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===0}"><span class="sw"><i style="background:${a}"></i><i style="background:${b}"></i></span>${n}</button>`).join('');
bar.onclick=ev=>{const c=ev.target.closest('[data-i]');if(!c)return;const[,a,b]=palettes[c.dataset.i];
 document.documentElement.style.setProperty('--a',a);document.documentElement.style.setProperty('--b',b);
 for(const x of bar.children)x.setAttribute('aria-pressed',x===c)};
const toggle=(id,on,off,cls,target)=>{const btn=document.getElementById(id);btn.onclick=()=>{const v=target.classList.toggle(cls);
 btn.setAttribute('aria-pressed',id==='motion'?v:v);btn.textContent=v?on:off}};
toggle('motion','Motion on','Motion off','anim',document.body);
toggle('bg','Light tiles','Light tiles','light',document.body);
</script></body></html>
