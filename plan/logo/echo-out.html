<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--a:#ff6b5b;--b:#2ec4b6;--tile:#101010;--fg:#f2efe9;--card:#171717;--text:#ededed}
body.mono{--a:var(--fg);--b:var(--fg)}
body.light{--tile:#faf8f5;--fg:#141414;--card:#ece8e1;--text:#141414}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground)}
.top{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--foreground);font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--secondary);border-color:var(--ring)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{border-radius:var(--radius,14px);background:var(--card);color:var(--text);padding:16px;display:grid;gap:12px}
.tile{width:150px;height:150px;justify-self:center;border-radius:34px;background:var(--tile);box-shadow:0 0 0 1px #8882,0 20px 40px -26px #000}
svg{display:block}.tile svg{width:100%;height:100%}
.row{display:flex;align-items:center;gap:10px}
.app,.fav{flex:none;background:var(--tile);box-shadow:0 0 0 1px #8882}
.app{width:44px;height:44px;border-radius:10px}.fav{width:16px;height:16px;border-radius:4px}
.app svg,.fav svg{width:100%;height:100%}
.lock{display:flex;align-items:center;gap:6px;padding:12px 14px;border-radius:12px;background:var(--tile)}
.lock svg{height:34px;width:auto}
.name{font-weight:650;font-size:14px}.num{font-size:11px;opacity:.5}
.idea{font-size:12.5px;opacity:.72;line-height:1.4}
polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ink polyline{stroke:var(--fg)!important}.ink polyline:last-child{stroke:var(--b)!important}
body.mono .ink polyline:last-child{stroke:var(--fg)!important}
</style></head><body>
<div class="top">
  <button class="chip" data-toggle="mono" aria-pressed="false">One colour</button>
  <button class="chip" data-toggle="light" aria-pressed="false">Light</button>
  <button class="chip" id="motion" aria-pressed="true">Motion on</button>
</div>
<div class="grid" id="grid"></div>
<svg id="probe" width="0" height="0" style="position:absolute"></svg>
<script>
// Four strokes per mark, which become e, the k stem, the k arm, and o. "ek" is coral, "o" teal.
const word=[
 {d:'M6 36H22A8 8 0 1 0 19.66 41.66',w:4.6},
 {d:'M28 20V44',w:4.6},
 {d:'M38 28L29.5 36.5L38 44',w:4.6},
 {d:'M50 28A8 8 0 1 1 50 44A8 8 0 1 1 50 28',w:4.6},
];
const r1=n=>Math.round(n*10)/10;
const arc=(cx,cy,r,a0,a1)=>{const p=a=>[r1(cx+r*Math.cos(a*Math.PI/180)),r1(cy+r*Math.sin(a*Math.PI/180))];const[x0,y0]=p(a0),[x1,y1]=p(a1);
 return `M${x0} ${y0}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1} ${y1}`};
const dot=(x,y,w)=>({dot:[x,y],w});
const marks=[
 {name:'Echo out',tag:'original',idea:'Where we were: three even beats and the wave they send out.',
  s:[dot(13,32,6.4),dot(22,32,6.4),dot(31,32,6.4),{d:'M37 9.5A26 26 0 0 1 37 54.5',w:5}]},
 {name:'Fade',tag:'refined',idea:'The beats get quieter as they travel, and the wave is centred on the first one, so it reads as one sound.',
  s:[dot(18,32,7.4),dot(26.5,32,5.8),dot(33.5,32,4.4),{d:arc(18,32,25,-52,52),w:5}]},
 {name:'Swell',tag:'refined',idea:'The opposite: the beats build up, then break into the echo.',
  s:[dot(17,32,4),dot(24,32,5.4),dot(32,32,7),{d:arc(17,32,27,-50,50),w:5}]},
 {name:'Answer',tag:'new',idea:'One coral wave, then its teal echo answers from further out.',
  s:[dot(19,32,9),{d:arc(19,32,14,-48,48),w:5},dot(19,32,9),{d:arc(19,32,27,-50,50),w:5}]},
 {name:'Repeat',tag:'new',idea:'The same wave twice: the teal one is the coral one, a moment later.',
  s:[dot(19,32,8),{d:arc(19,32,16,-55,55),w:5},dot(19,32,8),{d:arc(31,32,16,-55,55),w:5}]},
 {name:'Chamber',tag:'new',idea:'The beats walk into a ring that almost closes: the room they echo in.',
  s:[dot(10,32,5),dot(18,32,5),dot(26,32,5),{d:'M27.9 25A14 14 0 1 1 27.9 39',w:5}]},
 {name:'Embrace',tag:'new',idea:'The echo curls back around the beats, the way sound fills a room.',
  s:[dot(22,32,5.4),dot(31,32,5.4),dot(40,32,5.4),{d:arc(31,32,19,-118,118),w:5}]},
 {name:'Horizon',tag:'new',idea:'Calmer and wider: beats on a line, the echo rising over them.',
  s:[dot(16,40,6),dot(26,40,6),dot(36,40,6),{d:arc(26,40,19,-180,0),w:5}]},
];
const N=48, probe=document.getElementById('probe');
const sample=st=>{if(st.dot)return Array.from({length:N},()=>st.dot);
 const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',st.d);probe.append(p);
 const L=p.getTotalLength();const pts=Array.from({length:N},(_,i)=>{const q=p.getPointAtLength(L*i/(N-1));return[q.x,q.y]});p.remove();return pts};
const W=word.map(sample);
const colors=['var(--a)','var(--a)','var(--a)','var(--b)'];
const lines=()=>colors.map(c=>`<polyline stroke="${c}"/>`).join('');
const pts=(A,B,p)=>A.map(([x,y],j)=>`${(x+(B[j][0]-x)*p).toFixed(2)},${(y+(B[j][1]-y)*p).toFixed(2)}`).join(' ');
const draw=(svg,m,p)=>[...svg.querySelectorAll('polyline')].forEach((pl,i)=>{
 pl.setAttribute('points',pts(m.pts[i],W[i],p));pl.setAttribute('stroke-width',(m.s[i].w+(word[i].w-m.s[i].w)*p).toFixed(2))});
const wordmark=()=>`<g class="ink" transform="translate(58 -6) scale(1.2)">${word.map((w,i)=>`<polyline points="${pts(W[i],W[i],0)}" stroke-width="${w.w}"/>`).join('')}</g>`;
const grid=document.getElementById('grid');
marks.forEach((m,i)=>{m.pts=m.s.map(sample);
 const c=document.createElement('div');c.className='card';
 c.innerHTML=`<div class="tile"><svg viewBox="0 0 64 64">${lines()}</svg></div>
 <div class="row"><div class="app"><svg viewBox="0 0 64 64">${lines()}</svg></div><div class="fav"><svg viewBox="0 0 64 64">${lines()}</svg></div>
 <div><div class="num">${String(i+1).padStart(2,'0')} · ${m.tag}</div><div class="name">${m.name}</div></div></div>
 <div class="lock"><svg viewBox="6 4 128 56"><g class="bare">${lines()}</g>${wordmark()}</svg></div><div class="idea">${m.idea}</div>`;
 grid.append(c);m.svgs=[...c.querySelectorAll('.tile svg,.app svg,.fav svg,.bare')];for(const s of m.svgs)draw(s,m,0);});
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let on=true;const t0=performance.now();
// Hold the mark, morph to the word, hold, morph back.
const frame=now=>{const t=((now-t0)/1000)%5.2;
 const p=t<1.4?0:t<2.4?ease(t-1.4):t<4.2?1:ease(1-(t-4.2));
 for(const m of marks)draw(m.svgs[0],m,on?p:0);requestAnimationFrame(frame)};
requestAnimationFrame(frame);
document.getElementById('motion').onclick=e=>{on=!on;e.target.setAttribute('aria-pressed',on);e.target.textContent=on?'Motion on':'Motion off'};
for(const b of document.querySelectorAll('[data-toggle]'))b.onclick=()=>b.setAttribute('aria-pressed',document.body.classList.toggle(b.dataset.toggle));
</script></body></html>
