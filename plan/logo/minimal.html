<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--a:#ff6b5b;--b:#2ec4b6;--tile:#101010;--fg:#f2efe9;--card:#171717;--text:#ededed}
body.mono{--a:var(--fg);--b:var(--fg)}
body.light{--tile:#faf8f5;--fg:#141414;--card:#ece8e1;--text:#141414}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground)}
.top{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--foreground);font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--secondary);border-color:var(--ring)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{border-radius:var(--radius,14px);background:var(--card);color:var(--text);padding:16px;display:grid;gap:12px}
svg{display:block}
.tile{width:150px;height:150px;justify-self:center;border-radius:34px;background:var(--tile);box-shadow:0 0 0 1px #8882}
.tile svg,.app svg,.fav svg{width:100%;height:100%}
.row{display:flex;align-items:center;gap:10px}
.app,.fav{flex:none;background:var(--tile);box-shadow:0 0 0 1px #8882}
.app{width:44px;height:44px;border-radius:10px}.fav{width:16px;height:16px;border-radius:4px}
.lock{padding:12px 14px;border-radius:12px;background:var(--tile)}
.lock svg{height:34px;width:auto}
.name{font-weight:650;font-size:14px}.num{font-size:11px;opacity:.5}
.idea{font-size:12.5px;opacity:.72;line-height:1.4}
.a{fill:var(--a)}.b{fill:var(--b)}
.sa,.sb,.word path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.sa{stroke:var(--a)}.sb{stroke:var(--b)}
.word path{stroke:var(--fg);stroke-width:4.6}.word path:last-child{stroke:var(--b)}
.vb{transform-box:fill-box;transform-origin:center}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.25)}32%{transform:scale(1)}}
@keyframes lit{0%,45%,100%{opacity:.35}58%{opacity:1}}
.anim .t1{animation:beat 2.6s infinite}.anim .t2{animation:beat 2.6s .16s infinite}.anim .t3{animation:beat 2.6s .32s infinite}
.anim .l1{animation:lit 2.6s .55s infinite}.anim .l2{animation:lit 2.6s .7s infinite}.anim .l3{animation:lit 2.6s .85s infinite}
.anim .l4{animation:lit 2.6s 1s infinite}.anim .l5{animation:lit 2.6s 1.15s infinite}
</style></head><body class="anim">
<div class="top">
  <button class="chip" data-toggle="mono" aria-pressed="false">One colour</button>
  <button class="chip" data-toggle="light" aria-pressed="false">Light</button>
  <button class="chip" data-toggle="anim" aria-pressed="true">Motion</button>
</div>
<div class="grid" id="grid"></div>
<script>
// Coral is the computer's sound; teal is everyone it reaches.
const r2=n=>Math.round(n*100)/100;
const pt=(cx,cy,r,a)=>[r2(cx+r*Math.cos(a*Math.PI/180)),r2(cy+r*Math.sin(a*Math.PI/180))];
const arc=(cx,cy,r,a0,a1)=>{const[x0,y0]=pt(cx,cy,r,a0),[x1,y1]=pt(cx,cy,r,a1);return `M${x0} ${y0}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1} ${y1}`};
const dot=(x,y,r,c,cls='')=>`<circle class="${c} vb ${cls}" cx="${x}" cy="${y}" r="${r}"/>`;
const swell=(x,s=1)=>dot(x,32,2*s,'a','t1')+dot(x+7*s,32,2.7*s,'a','t2')+dot(x+15*s,32,3.4*s,'a','t3');
const listeners=(cx,cy,r,angles,size)=>angles.map((a,i)=>{const[x,y]=pt(cx,cy,r,a);return dot(x,y,size,'b','l'+(i+1))}).join('');
const marks=[
 {name:'Chamber',idea:'The sound walks into a room and rings there.',
  svg:`${swell(10)}<path class="sb" stroke-width="5" d="M28.9 25A14 14 0 1 1 28.9 39"/>`},
 {name:'Swell',idea:'The sound builds, then goes out as one wave.',
  svg:`<g transform="translate(2 0)">${swell(13)}<path class="sb" stroke-width="5" d="${arc(14,32,26,-50,50)}"/></g>`},
 {name:'Crowd',idea:'Swell, but the wave is made of listeners: the echo is the people.',
  svg:`<g transform="translate(6 0)">${swell(10)}${listeners(12,32,25,[-56,-28,0,28,56],2.8)}</g>`},
 {name:'Relay',idea:'Sound goes into the computer, and out to everyone around it.',
  svg:`<g transform="translate(3 0)">${swell(5,.8)}<path class="sa" stroke-width="4.5" d="M19.3 27A10 10 0 1 1 19.3 37"/>${listeners(28,32,21,[-38,0,38],2.7)}</g>`},
 {name:'Reach',idea:'One source, one wave, three listeners.',
  svg:`<g transform="translate(4 0)">${dot(16,32,5.5,'a','t1')}<path class="sb" stroke-width="4.5" d="${arc(16,32,15,-52,52)}"/>${listeners(16,32,27,[-40,0,40],3)}</g>`},
 {name:'Enter',idea:'The simplest: one sound, one open room.',
  svg:`${dot(15,32,4.6,'a','t1')}<path class="sb" stroke-width="5.5" d="M25.9 25A15 15 0 1 1 25.9 39"/>`},
 {name:'Room',idea:'Chamber, with the listeners already inside the room.',
  svg:`${dot(9,32,2.2,'a','t1')}${dot(16,32,2.9,'a','t2')}<path class="sa" stroke-width="5" d="M26.9 24A16 16 0 1 1 26.9 40"/>${listeners(39,32,7,[-90,30,150],2.4)}`},
 {name:'Fan',idea:'One dot, and its sound spreading out to three different directions.',
  svg:`${dot(17,32,5.5,'a','t1')}${[-36,0,36].map((a,i)=>`<path class="sb l${i+1}" stroke-width="4.5" d="${arc(17,32,21,a-11,a+11)}"/><path class="sb l${i+1}" stroke-width="4.5" opacity=".45" d="${arc(17,32,31,a-8,a+8)}"/>`).join('')}`},
];
const word=['M6 36H22A8 8 0 1 0 19.66 41.66','M28 20V44','M38 28L29.5 36.5L38 44','M50 28A8 8 0 1 1 50 44A8 8 0 1 1 50 28'];
const box=s=>`<svg viewBox="0 0 64 64">${s}</svg>`;
document.getElementById('grid').innerHTML=marks.map((m,i)=>`<div class="card"><div class="tile">${box(m.svg)}</div>
 <div class="row"><div class="app">${box(m.svg)}</div><div class="fav">${box(m.svg)}</div><div><div class="num">${String(i+1).padStart(2,'0')}</div><div class="name">${m.name}</div></div></div>
 <div class="lock"><svg viewBox="2 4 132 56">${m.svg}<g class="word" transform="translate(64 -6) scale(1.2)">${word.map(d=>`<path d="${d}"/>`).join('')}</g></svg></div>
 <div class="idea">${m.idea}</div></div>`).join('');
for(const b of document.querySelectorAll('[data-toggle]'))b.onclick=()=>b.setAttribute('aria-pressed',document.body.classList.toggle(b.dataset.toggle));
</script></body></html>
