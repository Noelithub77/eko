[package]
name = "eko"
version = "0.1.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "eko"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = { version = "2", features = ["colored"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1.11.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"
uuid = { version = "1.23.2", features = ["v4", "serde"] }
mdns-sd = "0.20.0"
cpal = { version = "0.18.1", features = ["pipewire", "pulseaudio"] }
webrtc = "0.17.1"
opus = "0.3.1"
local-ip-address = "0.6.13"
specta = "2.0.0-rc.25"
tauri-specta = { version = "2.0.0-rc.25", features = ["typescript"] }
specta-typescript = "0.0.12"
specta-serde = "0.0.12"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rubato = "0.16"
rust-embed = "8.11.0"

[target."cfg(windows)".dependencies]
wasapi = "0.23.0"
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"
mpris = "2.1.0"
[target.'cfg(target_os = "windows")'.dependencies]
smtc-suite = "2.6.1"

[target.'cfg(target_os = "android")'.dependencies]
oboe = { version = "0.6.1", features = ["fetch-prebuilt", "java-interface"] }

[profile.dev.package.audiopus_sys]
opt-level = 3
debug = false
