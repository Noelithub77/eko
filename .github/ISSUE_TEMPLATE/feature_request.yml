name: Feature request
description: Suggest a focused improvement for Eko.
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
  - type: upload
    id: screenshot
    attributes:
      label: Screenshots or mockup
      description: Attach screenshots, a mockup, or a reference image that helps explain the idea. Redact secrets and personal data.
    validations:
      required: true
