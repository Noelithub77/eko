name: Platform builds
run-name: Build all platforms at ${{ github.sha }}

on:
  push:
    branches: ['build/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: 11.5.0
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  CARGO_BUILD_JOBS: 2

jobs:
  desktop:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            bundle: nsis
          - platform: Linux
            os: ubuntu-22.04
            bundle: appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libpipewire-0.3-dev libasound2-dev libpulse-dev patchelf libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./rust -> target
          prefix-key: v1-rust
      - run: pnpm install --frozen-lockfile
      - name: Build desktop package
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundle }} --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload desktop packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eko-${{ matrix.platform }}-${{ github.sha }}
          path: |
            rust/target/release/bundle/nsis/*.exe
            rust/target/release/bundle/appimage/*.AppImage
            rust/target/release/eko.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android APK and AAB
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID_NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android build packages
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./rust -> target
          prefix-key: v1-rust
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web:client
      - name: Build Android validation packages
        run: pnpm tauri android build --apk --aab --debug --target aarch64 --ci
      - name: Upload Android validation packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eko-Android-debug-${{ github.sha }}
          path: |
            rust/gen/android/app/build/outputs/apk/**/*.apk
            rust/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

  web:
    name: Build hosted web
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - name: Upload hosted web
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eko-Web-${{ github.sha }}
          path: dist/hosted/
          if-no-files-found: error
          retention-days: 14
