name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        type: choice
        options:
          - windows-exe
          - linux-appimage
          - android-apk
          - android-aab
      bump_patch:
        description: Patch bump package.json before building
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  PNPM_VERSION: 11.5.0
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  ANDROID_PLATFORM_PACKAGE: platforms;android-36
  ANDROID_BUILD_TOOLS_PACKAGE: build-tools;36.0.0
  ANDROID_NDK_VERSION: 27.0.12077973
  ANDROID_NDK_PACKAGE: ndk;27.0.12077973

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.release.outputs.app_version }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load release env
        run: |
          while IFS='=' read -r name value; do
            if [ -z "$name" ] || [[ "$name" == \#* ]]; then
              continue
            fi
            if [[ "$name" == *KEY* || "$name" == *PASSWORD* ]]; then
              echo "::add-mask::$value"
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
          done < actions.env

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch bump app version
        if: inputs.bump_patch
        run: |
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Patch bump releases must run from a branch."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          pnpm run release:sync-version
          git add package.json rust/Cargo.toml rust/tauri.conf.json
          git commit -m "chore: bump release version"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create or reuse GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="eko-v${APP_VERSION}"
          RELEASE_SHA="$(git rev-parse HEAD)"

          if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git tag "${RELEASE_TAG}" "${RELEASE_SHA}"
            git push origin "${RELEASE_TAG}"
          fi

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "Eko v${APP_VERSION}" \
              --notes "Manual Eko release." \
              --target "${RELEASE_SHA}" \
              --latest
          fi

          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq ".id")"

          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  windows-exe:
    name: Build Windows EXE
    needs: prepare
    if: inputs.target == 'windows-exe'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Load release env
        shell: bash
        run: |
          while IFS='=' read -r name value; do
            if [ -z "$name" ] || [[ "$name" == \#* ]]; then
              continue
            fi
            if [[ "$name" == *KEY* || "$name" == *PASSWORD* ]]; then
              echo "::add-mask::$value"
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
          done < actions.env

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./rust -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download old updater metadata
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/old-updater"
          curl -fsSL "${PUBLIC_UPDATE_BASE_URL}/latest.json" -o "$RUNNER_TEMP/old-updater/latest.json" || true

      - name: Build and upload Windows EXE
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tauriScript: pnpm tauri
          args: --bundles nsis --ci
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      - name: Upload Windows portable EXE
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp rust/target/release/eko.exe "$RUNNER_TEMP/release-assets/eko_${APP_VERSION}_x64.exe"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release-assets/eko_${APP_VERSION}_x64.exe" --clobber

      - name: Publish public Windows updater
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          SETUP_NAME="eko_${APP_VERSION}_x64-setup.exe"
          SETUP_PATH="rust/target/release/bundle/nsis/${SETUP_NAME}"
          PUBLIC_SETUP_URL="${PUBLIC_UPDATE_BASE_URL}/updates/windows/${SETUP_NAME}"

          mkdir -p "$RUNNER_TEMP/new-updater" "$RUNNER_TEMP/merged-updater"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/new-updater" --clobber
          pnpm run release:merge-public-updater-json -- "$RUNNER_TEMP/old-updater" "$RUNNER_TEMP/new-updater" "$RUNNER_TEMP/merged-updater/latest.json" "$PUBLIC_SETUP_URL" windows-x86_64 windows-x86_64-nsis

          PAGES_DIR="$RUNNER_TEMP/public-updates"
          if ! git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PAGES_DIR"; then
            mkdir -p "$PAGES_DIR"
            git -C "$PAGES_DIR" init
            git -C "$PAGES_DIR" checkout -b gh-pages
          fi

          mkdir -p "$PAGES_DIR/updates/windows"
          cp "$SETUP_PATH" "$PAGES_DIR/updates/windows/$SETUP_NAME"
          cp "${SETUP_PATH}.sig" "$PAGES_DIR/updates/windows/${SETUP_NAME}.sig"
          cp "$RUNNER_TEMP/merged-updater/latest.json" "$PAGES_DIR/latest.json"
          touch "$PAGES_DIR/.nojekyll"

          git -C "$PAGES_DIR" config user.name "github-actions[bot]"
          git -C "$PAGES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PAGES_DIR" add .
          if git -C "$PAGES_DIR" diff --cached --quiet; then
            echo "Public updater files are already current."
          else
            git -C "$PAGES_DIR" commit -m "publish public updater assets"
            git -C "$PAGES_DIR" push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          fi

          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/merged-updater/latest.json" --clobber

  linux-appimage:
    name: Build Linux AppImage
    needs: prepare
    if: inputs.target == 'linux-appimage'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Load release env
        run: |
          while IFS='=' read -r name value; do
            if [ -z "$name" ] || [[ "$name" == \#* ]]; then
              continue
            fi
            if [[ "$name" == *KEY* || "$name" == *PASSWORD* ]]; then
              echo "::add-mask::$value"
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
          done < actions.env

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./rust -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download old updater metadata
        run: |
          mkdir -p "$RUNNER_TEMP/old-updater"
          curl -fsSL "${PUBLIC_UPDATE_BASE_URL}/latest.json" -o "$RUNNER_TEMP/old-updater/latest.json" || true

      - name: Build and upload Linux AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tauriScript: pnpm tauri
          args: --bundles appimage --ci
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      - name: Publish public Linux updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          APPIMAGE_PATH="$(find rust/target/release/bundle/appimage -name "*.AppImage" -type f | head -n 1)"
          if [ -z "$APPIMAGE_PATH" ]; then
            echo "Could not find Linux AppImage output."
            exit 1
          fi
          APPIMAGE_NAME="$(basename "$APPIMAGE_PATH")"
          PUBLIC_APPIMAGE_URL="${PUBLIC_UPDATE_BASE_URL}/updates/linux/${APPIMAGE_NAME}"

          mkdir -p "$RUNNER_TEMP/new-updater" "$RUNNER_TEMP/merged-updater"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/new-updater" --clobber
          pnpm run release:merge-public-updater-json -- "$RUNNER_TEMP/old-updater" "$RUNNER_TEMP/new-updater" "$RUNNER_TEMP/merged-updater/latest.json" "$PUBLIC_APPIMAGE_URL" linux-x86_64

          PAGES_DIR="$RUNNER_TEMP/public-updates"
          if ! git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PAGES_DIR"; then
            mkdir -p "$PAGES_DIR"
            git -C "$PAGES_DIR" init
            git -C "$PAGES_DIR" checkout -b gh-pages
          fi

          mkdir -p "$PAGES_DIR/updates/linux"
          cp "$APPIMAGE_PATH" "$PAGES_DIR/updates/linux/$APPIMAGE_NAME"
          if [ -f "${APPIMAGE_PATH}.sig" ]; then
            cp "${APPIMAGE_PATH}.sig" "$PAGES_DIR/updates/linux/${APPIMAGE_NAME}.sig"
          fi
          cp "$RUNNER_TEMP/merged-updater/latest.json" "$PAGES_DIR/latest.json"
          touch "$PAGES_DIR/.nojekyll"

          git -C "$PAGES_DIR" config user.name "github-actions[bot]"
          git -C "$PAGES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PAGES_DIR" add .
          if git -C "$PAGES_DIR" diff --cached --quiet; then
            echo "Public updater files are already current."
          else
            git -C "$PAGES_DIR" commit -m "publish public updater assets"
            git -C "$PAGES_DIR" push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          fi

          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/merged-updater/latest.json" --clobber

  android:
    name: Build Android
    needs: prepare
    if: inputs.target == 'android-apk' || inputs.target == 'android-aab'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Load release env
        run: |
          while IFS='=' read -r name value; do
            if [ -z "$name" ] || [[ "$name" == \#* ]]; then
              continue
            fi
            if [[ "$name" == *KEY* || "$name" == *PASSWORD* ]]; then
              echo "::add-mask::$value"
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
          done < actions.env

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "$ANDROID_PLATFORM_PACKAGE" "$ANDROID_BUILD_TOOLS_PACKAGE" "$ANDROID_NDK_PACKAGE"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./rust -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Android signing key
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/eko-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$KEYSTORE_PATH"
          } > rust/gen/android/keystore.properties

      - name: Build Android APK
        if: inputs.target == 'android-apk'
        run: pnpm tauri android build --apk --target aarch64 --ci

      - name: Build Android AAB
        if: inputs.target == 'android-aab'
        run: pnpm tauri android build --aab --target aarch64 --ci

      - name: Collect Android package
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          TARGET: ${{ inputs.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          if [ "$TARGET" = "android-apk" ]; then
            PACKAGE_PATH="$(find rust/gen/android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)"
            PACKAGE_NAME="eko-${APP_VERSION}-android-aarch64.apk"
          else
            PACKAGE_PATH="$(find rust/gen/android/app/build/outputs/bundle -name "*.aab" -type f | head -n 1)"
            PACKAGE_NAME="eko-${APP_VERSION}-android-aarch64.aab"
          fi

          if [ -z "$PACKAGE_PATH" ]; then
            echo "Could not find Android package output."
            exit 1
          fi

          cp "$PACKAGE_PATH" "$RUNNER_TEMP/release-assets/$PACKAGE_NAME"

      - name: Upload Android package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/release-assets/* --clobber

  cleanup-empty-release:
    name: Cleanup empty failed release
    needs: [prepare, windows-exe, linux-appimage, android]
    if: always() && needs.prepare.result == 'success' && (needs.windows-exe.result == 'failure' || needs.linux-appimage.result == 'failure' || needs.android.result == 'failure')
    runs-on: ubuntu-22.04
    steps:
      - name: Delete release with no assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "No release exists for $RELEASE_TAG."
            exit 0
          fi

          ASSET_COUNT="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')"
          if [ "$ASSET_COUNT" != "0" ]; then
            echo "Keeping $RELEASE_TAG because it has $ASSET_COUNT asset(s)."
            exit 0
          fi

          gh release delete "$RELEASE_TAG" --cleanup-tag --yes
          echo "Deleted empty release $RELEASE_TAG."
