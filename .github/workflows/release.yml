name: Release

on:
  workflow_dispatch:
    inputs:
      windows_exe:
        description: Build Windows EXE
        required: true
        type: boolean
        default: false
      linux_appimage:
        description: Build Linux AppImage
        required: true
        type: boolean
        default: false
      android_apk:
        description: Build Android APK
        required: true
        type: boolean
        default: false
      android_aab:
        description: Build Android AAB
        required: true
        type: boolean
        default: false
      bump_minor:
        description: Minor bump package.json before building
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_BUILD_JOBS: 2
  PNPM_VERSION: 11.5.0
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  ANDROID_PLATFORM_PACKAGE: platforms;android-36
  ANDROID_BUILD_TOOLS_PACKAGE: build-tools;36.0.0
  ANDROID_NDK_VERSION: 27.0.12077973
  ANDROID_NDK_PACKAGE: ndk;27.0.12077973

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.release.outputs.app_version }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate build targets
        run: |
          selected=0
          if [ "${{ inputs.windows_exe }}" = "true" ]; then selected=$((selected + 1)); fi
          if [ "${{ inputs.linux_appimage }}" = "true" ]; then selected=$((selected + 1)); fi
          if [ "${{ inputs.android_apk }}" = "true" ]; then selected=$((selected + 1)); fi
          if [ "${{ inputs.android_aab }}" = "true" ]; then selected=$((selected + 1)); fi

          if [ "$selected" -eq 0 ]; then
            echo "Select at least one build target."
            exit 1
          fi

      - name: Minor bump app version
        if: inputs.bump_minor
        run: |
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Minor bump releases must run from a branch."
            exit 1
          fi

          git config user.name "Noel Georgi"
          git config user.email "noelmcv7@gmail.com"
          npm version minor --no-git-tag-version
          pnpm run release:sync-version
          git add package.json rust/Cargo.toml rust/tauri.conf.json
          git commit -m "chore: bump release version"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create or reuse GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="eko-v${APP_VERSION}"
          RELEASE_SHA="$(git rev-parse HEAD)"

          if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git tag "${RELEASE_TAG}" "${RELEASE_SHA}"
            git push origin "${RELEASE_TAG}"
          fi

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "Eko v${APP_VERSION}" \
              --notes "Manual Eko release." \
              --target "${RELEASE_SHA}" \
              --draft
          fi

          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq ".id")"

          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  windows-exe:
    name: Build Windows EXE
    needs: prepare
    if: inputs.windows_exe == true
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./rust -> target
          shared-key: desktop-Windows
          prefix-key: v1-rust
          cache-on-failure: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows EXE
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build --bundles nsis --ci

      - name: Upload Windows Tauri assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          SETUP_PATH="rust/target/release/bundle/nsis/eko_${APP_VERSION}_x64-setup.exe"
          gh release upload "$RELEASE_TAG" \
            "$SETUP_PATH" \
            "${SETUP_PATH}.sig" \
            --clobber

      - name: Upload Windows portable EXE
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp rust/target/release/eko.exe "$RUNNER_TEMP/release-assets/eko_${APP_VERSION}_x64.exe"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release-assets/eko_${APP_VERSION}_x64.exe" --clobber

  linux-appimage:
    name: Build Linux AppImage
    needs: prepare
    if: inputs.linux_appimage == true
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libpipewire-0.3-dev libasound2-dev libpulse-dev patchelf libfuse2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./rust -> target
          shared-key: desktop-Linux
          prefix-key: v1-rust
          cache-on-failure: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload Linux AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: .
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.release_tag }}
          releaseDraft: true
          tauriScript: pnpm tauri
          args: --bundles appimage --ci
          includeUpdaterJson: false

  android:
    name: Build Android
    needs: prepare
    if: inputs.android_apk == true || inputs.android_aab == true
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android packages
        run: |
          sdkmanager "$ANDROID_PLATFORM_PACKAGE" "$ANDROID_BUILD_TOOLS_PACKAGE" "$ANDROID_NDK_PACKAGE"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./rust -> target
          shared-key: android-arm64
          prefix-key: v1-rust
          cache-on-failure: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android frontend assets
        run: |
          pnpm run build:mobile
          pnpm run build:web:client

      - name: Restore Android signing key
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/eko-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$KEYSTORE_PATH"
          } > rust/gen/android/keystore.properties

      - name: Build selected Android packages together
        env:
          BUILD_APK: ${{ inputs.android_apk }}
          BUILD_AAB: ${{ inputs.android_aab }}
        run: |
          packages=()
          if [ "$BUILD_APK" = "true" ]; then packages+=(--apk); fi
          if [ "$BUILD_AAB" = "true" ]; then packages+=(--aab); fi
          pnpm tauri android build "${packages[@]}" --target aarch64 --ci

      - name: Collect Android packages
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          BUILD_APK: ${{ inputs.android_apk }}
          BUILD_AAB: ${{ inputs.android_aab }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          package_count=0

          if [ "$BUILD_APK" = "true" ]; then
            PACKAGE_PATH="$(find rust/gen/android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)"
            if [ -z "$PACKAGE_PATH" ]; then
              echo "Could not find Android APK output."
              exit 1
            fi
            cp "$PACKAGE_PATH" "$RUNNER_TEMP/release-assets/eko-${APP_VERSION}-android-aarch64.apk"
            package_count=$((package_count + 1))
          fi

          if [ "$BUILD_AAB" = "true" ]; then
            PACKAGE_PATH="$(find rust/gen/android/app/build/outputs/bundle -name "*.aab" -type f | head -n 1)"
            if [ -z "$PACKAGE_PATH" ]; then
              echo "Could not find Android AAB output."
              exit 1
            fi
            cp "$PACKAGE_PATH" "$RUNNER_TEMP/release-assets/eko-${APP_VERSION}-android-aarch64.aab"
            package_count=$((package_count + 1))
          fi

          if [ "$package_count" -eq 0 ]; then
            echo "No Android package was selected."
            exit 1
          fi

      - name: Upload Android package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/release-assets/* --clobber

  publish:
    name: Verify assets and publish release
    needs: [prepare, windows-exe, linux-appimage, android]
    if: always() && needs.prepare.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify all selected packages and merge updater platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          BUILD_WINDOWS: ${{ inputs.windows_exe }}
          BUILD_LINUX: ${{ inputs.linux_appimage }}
          BUILD_APK: ${{ inputs.android_apk }}
          BUILD_AAB: ${{ inputs.android_aab }}
        run: node scripts/finalize-release.mjs

  cleanup-empty-release:
    name: Cleanup empty failed release
    needs: [prepare, windows-exe, linux-appimage, android]
    if: always() && needs.prepare.result == 'success' && (needs.windows-exe.result == 'failure' || needs.linux-appimage.result == 'failure' || needs.android.result == 'failure')
    runs-on: ubuntu-22.04
    steps:
      - name: Delete release with no assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "No release exists for $RELEASE_TAG."
            exit 0
          fi

          ASSET_COUNT="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')"
          if [ "$ASSET_COUNT" != "0" ]; then
            echo "Keeping $RELEASE_TAG because it has $ASSET_COUNT asset(s)."
            exit 0
          fi

          gh release delete "$RELEASE_TAG" --cleanup-tag --yes
          echo "Deleted empty release $RELEASE_TAG."
